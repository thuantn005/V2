name: Build APK

# Builds the integrated Brainfuck-Psiphon + SocksDroid Android app.
#
# Steps:
#   1. Cross-compile the Go tunnel engine (libbrainfuck.so) with the NDK.
#   2. Cross-compile Psiphon core (libpsiphon.so) from psiphon-tunnel-core.
#   3. Drop both into app/src/main/jniLibs/<abi>/.
#   4. Assemble a signed release APK (and a debug APK) with Gradle.
#   5. Upload the APKs as artifacts, and attach them to a Release on tag push.

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.22"
  PSIPHON_REF: "master"
  # Android API level the native binaries target (minSdk of the app).
  ANDROID_API: "21"
  # Pin an NDK that ships the android21 clang wrappers (the preinstalled r29
  # preview only provides API 22+ wrappers).
  NDK_VERSION: "26.3.11579264"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve NDK toolchain
        id: ndk
        run: |
          set -e
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK" ]; then
            echo "Installing NDK ${NDK_VERSION}..."
            yes | sdkmanager "ndk;${NDK_VERSION}" >/dev/null
          fi
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "Using NDK toolchain: $TOOLCHAIN"
          # Sanity check: the API-level clang wrappers we rely on must exist.
          test -x "$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          ls "$TOOLCHAIN"/*android${ANDROID_API}-clang

      - name: Build tunnel engine (libbrainfuck.so)
        run: |
          set -e
          TC="${{ steps.ndk.outputs.toolchain }}"
          API="${ANDROID_API}"
          build() {
            abi="$1"; goarch="$2"; cc="$3"; goarm="$4"
            echo ">> engine $abi (CC=$TC/$cc)"
            test -x "$TC/$cc"
            mkdir -p "app/src/main/jniLibs/$abi"
            (
              cd engine
              export CGO_ENABLED=1 GOOS=android GOARCH="$goarch"
              export CC="$TC/$cc"
              export GOFLAGS=-mod=vendor
              [ -n "$goarm" ] && export GOARM="$goarm"
              go build -trimpath -ldflags "-s -w" \
                -o "../app/src/main/jniLibs/$abi/libbrainfuck.so" .
            )
          }
          build arm64-v8a   arm64 "aarch64-linux-android${API}-clang"    ""
          build armeabi-v7a arm   "armv7a-linux-androideabi${API}-clang" "7"
          build x86_64      amd64 "x86_64-linux-android${API}-clang"     ""

      - name: Build Psiphon core (libpsiphon.so)
        run: |
          set -e
          TC="${{ steps.ndk.outputs.toolchain }}"
          API="${ANDROID_API}"
          git clone --depth 1 --branch "${PSIPHON_REF}" \
            https://github.com/Psiphon-Labs/psiphon-tunnel-core.git psi
          build() {
            abi="$1"; goarch="$2"; cc="$3"; goarm="$4"
            echo ">> psiphon $abi (CC=$TC/$cc)"
            test -x "$TC/$cc"
            (
              cd psi/ConsoleClient
              export CGO_ENABLED=1 GOOS=android GOARCH="$goarch"
              export CC="$TC/$cc"
              [ -n "$goarm" ] && export GOARM="$goarm"
              go build -trimpath -ldflags "-s -w" \
                -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/libpsiphon.so" .
            )
          }
          build arm64-v8a   arm64 "aarch64-linux-android${API}-clang"    ""
          build armeabi-v7a arm   "armv7a-linux-androideabi${API}-clang" "7"
          build x86_64      amd64 "x86_64-linux-android${API}-clang"     ""

      - name: List native libs
        run: |
          for a in arm64-v8a armeabi-v7a x86_64; do
            echo "== $a =="; ls -la "app/src/main/jniLibs/$a"
          done

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -storepass brainfuck -keypass brainfuck \
            -alias brainfuck -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Brainfuck VPN, OU=Dev, O=Dev, L=NA, S=NA, C=NA"

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease \
            -PRELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.keystore" \
            -PRELEASE_STORE_PASSWORD=brainfuck \
            -PRELEASE_KEY_ALIAS=brainfuck \
            -PRELEASE_KEY_PASSWORD=brainfuck

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrainfuckVPN-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
