apply plugin: 'com.android.application'

android {
    namespace 'net.typeblog.socks'
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "net.typeblog.socks"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 20
        versionName "2.0"

        // The tun2socks core (hev-socks5-tunnel) is built from source via
        // ndk-build; restrict to the ABIs we ship prebuilt engine libs for.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            ndkBuild {
                // hev-socks5-tunnel's JNI (src/hev-jni.c) registers its native
                // methods on the class named by these macros — must match
                // net.typeblog.socks.HevTunnel. Passed here (not just via
                // Application.mk) because AGP drives ndk-build with its own flags.
                cFlags '-DPKGNAME=net/typeblog/socks', '-DCLSNAME=HevTunnel'
                // Build only the shared library; skip hev's standalone executable.
                targets 'hev-socks5-tunnel'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // SocksVpnService talks to the UI through an .aidl interface; AGP 8
        // disables AIDL by default so we must turn it back on.
        aidl true
        // BuildConfig (used for BuildConfig.DEBUG) is also off by default in AGP 8.
        buildConfig true
    }

    // Native tunnel binaries (libbrainfuck.so, libpsiphon.so, libtun2socks.so …)
    // are exec()'d from the native library directory, so they must be extracted
    // to disk at install time rather than mapped straight from the APK.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        release {
            def storePath = project.findProperty('RELEASE_STORE_FILE')
            if (storePath != null) {
                storeFile file(storePath)
                storePassword project.findProperty('RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
